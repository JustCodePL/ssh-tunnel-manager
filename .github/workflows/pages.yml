name: Deploy GitHub Pages

on:
  push:
    branches: [main, beta]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # One Pages deployment replaces the previous one, so every run publishes
      # both branches, whichever of them triggered it.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test release presentation
        run: |
          (cd main && node --test docs/*.test.cjs)
          (cd beta && node --test docs/*.test.cjs)

      - name: Assemble site
        run: |
          test ! -e main/docs/beta
          cp -R main/docs _site
          cp -R beta/docs _site/beta
          # Search engines should index production pages only.
          find _site/beta -name '*.html' -exec \
            sed -i 's|<head>|<head><meta name="robots" content="noindex" />|' {} +

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
