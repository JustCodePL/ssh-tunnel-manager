name: Build

on:
  push:
    tags: ["v*"]
  # Manual runs build, sign, notarize and verify the artifacts without
  # publishing: the release job below only runs for tags.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N"
            exit 1
          fi

  test:
    needs: validate
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
            artifact: ssh-tunnel-manager
          - os: macos-latest
            platform: darwin
            arch: arm64
            artifact: ssh-tunnel-manager.app
          - os: macos-latest
            platform: darwin
            arch: amd64
            artifact: ssh-tunnel-manager.app
          - os: windows-latest
            platform: windows
            arch: amd64
            artifact: ssh-tunnel-manager.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP_VERSION="${{ github.ref_name }}"
          echo "APP_VERSION=${APP_VERSION#v}" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb dbus

      - name: Install NSIS
        if: matrix.platform == 'windows'
        uses: negrutiu/nsis-install@v2

      - name: Build
        shell: bash
        run: scripts/build-app.sh ${{ matrix.arch }} ${{ env.APP_VERSION }}

      # Starts the real app with its webviews and fails the release when the
      # frontend cannot reach the backend. The amd64 macOS build cannot run on an
      # arm64 runner without Rosetta, so it is skipped there.
      - name: Smoke test (macOS)
        if: matrix.platform == 'darwin' && matrix.arch == 'arm64'
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-home"
          STM_SMOKE_TEST=1 HOME="$RUNNER_TEMP/smoke-home" "build/bin/SSH Tunnel Manager.app/Contents/MacOS/ssh-tunnel-manager"

      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        run: |
          # WebKitGTK's sandbox needs user namespaces, which the runner's AppArmor
          # profile blocks by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p "$RUNNER_TEMP/smoke-home"
          STM_SMOKE_TEST=1 HOME="$RUNNER_TEMP/smoke-home" xvfb-run -a dbus-run-session -- build/bin/ssh-tunnel-manager

      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:STM_SMOKE_TEST = "1"
          $env:USERPROFILE = "$env:RUNNER_TEMP\smoke-home"
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $app = Start-Process -FilePath "build\bin\ssh-tunnel-manager.exe" -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "smoke test failed with exit code $($app.ExitCode)" }

      - name: Import Developer ID certificate
        if: matrix.platform == 'darwin'
        env:
          DEVELOPER_ID_APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$DEVELOPER_ID_APPLICATION_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Codesign app bundle
        if: matrix.platform == 'darwin'
        run: |
          PORTLESS_PLIST="build/bin/SSH Tunnel Manager.app/Contents/Library/LaunchDaemons/pl.justcode.ssh-tunnel-manager.portless.plist"
          plutil -lint "$PORTLESS_PLIST"
          /usr/libexec/PlistBuddy -c 'Print :BundleProgram' "$PORTLESS_PLIST" | grep -Fx 'Contents/Library/HelperTools/ssh-tunnel-manager-portless'
          /usr/libexec/PlistBuddy -c 'Print :AssociatedBundleIdentifiers:0' "$PORTLESS_PLIST" | grep -Fx 'com.wails.ssh-tunnel-manager'
          PORTLESS_HELPER="build/bin/SSH Tunnel Manager.app/Contents/Library/HelperTools/ssh-tunnel-manager-portless"
          APP_BINARY="build/bin/SSH Tunnel Manager.app/Contents/MacOS/ssh-tunnel-manager"
          test -x "$PORTLESS_HELPER"
          test "$(lipo -archs "$PORTLESS_HELPER")" = "$(lipo -archs "$APP_BINARY")"
          if otool -L "$PORTLESS_HELPER" | grep -q ServiceManagement; then
            echo "Portless helper must not include the ServiceManagement registration bridge" >&2
            exit 1
          fi

          IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "Signing with identity: $IDENTITY"

          find "build/bin/SSH Tunnel Manager.app" -type f \( -name "*.dylib" -o -name "*.framework" -o -perm +111 \) \
            ! -path "*/Contents/Library/HelperTools/ssh-tunnel-manager-portless" -exec \
            codesign --force --options runtime --timestamp \
              --entitlements build/darwin/entitlements.plist \
              --sign "$IDENTITY" {} \;

          codesign --force --options runtime --timestamp \
            --entitlements build/darwin/portless-helper.entitlements.plist \
            --sign "$IDENTITY" \
            "build/bin/SSH Tunnel Manager.app/Contents/Library/HelperTools/ssh-tunnel-manager-portless"

          codesign --force --options runtime --timestamp \
            --entitlements build/darwin/entitlements.plist \
            --sign "$IDENTITY" \
            "build/bin/SSH Tunnel Manager.app"

          codesign --verify --verbose "build/bin/SSH Tunnel Manager.app"

      # Notarizing only the DMG leaves the app inside without a stapled ticket,
      # so Gatekeeper has to reach Apple on first launch. Notarize and staple
      # the app itself before it goes into the DMG.
      - name: Notarize and staple app bundle
        if: matrix.platform == 'darwin'
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          APP="build/bin/SSH Tunnel Manager.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-notarize.zip" \
            --apple-id artur.czuba.94@gmail.com \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id 4VWT253QFF \
            --wait --output-format json > "$RUNNER_TEMP/app-notarize.json"
          STATUS=$(jq -r .status "$RUNNER_TEMP/app-notarize.json")
          echo "App notarization status: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            cat "$RUNNER_TEMP/app-notarize.json"
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Create macOS DMG
        if: matrix.platform == 'darwin'
        run: |
          brew install create-dmg
          create-dmg \
            --volname "SSH Tunnel Manager" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "SSH Tunnel Manager.app" 150 190 \
            --hide-extension "SSH Tunnel Manager.app" \
            --app-drop-link 450 190 \
            --codesign "$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | grep 'Developer ID Application' | head -1 | awk -F'\"' '{print $2}')" \
            "build/bin/ssh-tunnel-manager.dmg" \
            "build/bin/"

      - name: Notarize DMG
        if: matrix.platform == 'darwin'
        uses: lando/notarize-action@v2
        with:
          product-path: build/bin/ssh-tunnel-manager.dmg
          appstore-connect-username: artur.czuba.94@gmail.com
          appstore-connect-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          appstore-connect-team-id: 4VWT253QFF
          verbose: true

      - name: Staple notarization ticket
        if: matrix.platform == 'darwin'
        run: xcrun stapler staple "build/bin/ssh-tunnel-manager.dmg"

      - name: Verify notarization
        if: matrix.platform == 'darwin'
        run: |
          xcrun stapler validate "build/bin/ssh-tunnel-manager.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "build/bin/ssh-tunnel-manager.dmg"

          MOUNT_DIR=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_DIR" "build/bin/ssh-tunnel-manager.dmg"
          xcrun stapler validate "$MOUNT_DIR/SSH Tunnel Manager.app"
          spctl --assess --type execute --verbose=2 "$MOUNT_DIR/SSH Tunnel Manager.app"
          hdiutil detach "$MOUNT_DIR"

      - name: Cleanup keychain
        if: matrix.platform == 'darwin' && always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      - name: Upload Linux artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-manager-linux-amd64
          path: build/bin/ssh-tunnel-manager

      - name: Upload macOS artifact
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-manager-darwin-${{ matrix.arch }}
          path: build/bin/ssh-tunnel-manager.dmg

      - name: Upload Windows portable artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-manager-windows-amd64
          path: build/bin/ssh-tunnel-manager.exe

      - name: Upload Windows installer artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-manager-windows-amd64-installer
          path: build/bin/ssh-tunnel-manager-amd64-installer.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Tests are required twice over: build needs them, and so does this job.
    needs: [test, build]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release metadata from tag message
        id: release_metadata
        shell: bash
        run: |
          # actions/checkout resolves the workflow's tag ref by force-fetching
          # the tagged commit into refs/tags/<tag>, which clobbers the annotated
          # tag object with a lightweight ref. %(contents) on a lightweight tag
          # yields the commit subject, so the release body would otherwise show
          # the last commit message. Re-fetch the annotated tag object first.
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents)' "${{ github.ref_name }}" > tag-message.md
          release_name=$(sed -n '/[^[:space:]]/{p;q;}' tag-message.md)
          if [[ -z "$release_name" ]]; then
            release_name="${{ github.ref_name }}"
          fi
          printf 'name=%s\n' "$release_name" >> "$GITHUB_OUTPUT"

          # The first non-empty line is the release title. Keep the remaining
          # paragraphs as the release body so the title is not duplicated.
          awk 'found { print; next } /[^[:space:]]/ { found=1 }' tag-message.md > release-notes.md
          echo "Release title: $release_name"
          cat release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          tar czf ssh-tunnel-manager-linux-amd64.tar.gz \
            -C ssh-tunnel-manager-linux-amd64 .
          cp ssh-tunnel-manager-darwin-arm64/ssh-tunnel-manager.dmg ./ssh-tunnel-manager-darwin-arm64.dmg
          cp ssh-tunnel-manager-darwin-amd64/ssh-tunnel-manager.dmg ./ssh-tunnel-manager-darwin-amd64.dmg
          zip -r ssh-tunnel-manager-windows-amd64.zip \
            ssh-tunnel-manager-windows-amd64/
          cp ssh-tunnel-manager-windows-amd64-installer/ssh-tunnel-manager-amd64-installer.exe ./

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_metadata.outputs.name }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          make_latest: ${{ contains(github.ref_name, '-beta.') && 'false' || 'true' }}
          files: |
            artifacts/ssh-tunnel-manager-linux-amd64.tar.gz
            artifacts/ssh-tunnel-manager-darwin-arm64.dmg
            artifacts/ssh-tunnel-manager-darwin-amd64.dmg
            artifacts/ssh-tunnel-manager-windows-amd64.zip
            artifacts/ssh-tunnel-manager-amd64-installer.exe
