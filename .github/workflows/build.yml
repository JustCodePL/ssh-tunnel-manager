name: Build

on:
  push:
    tags: ["v*"]
  # Manual runs build, sign, notarize and verify the artifacts without
  # publishing: the release job below only runs for tags. Only maintainers can
  # start one. Dispatched on a tag ref, a run publishes like a tag push, which is
  # the fallback when the self-hosted Mac is unavailable (macos_runner).
  workflow_dispatch:
    inputs:
      macos_runner:
        description: Where the macOS builds run
        type: choice
        options: [self-hosted, github-hosted]
        default: self-hosted

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N"
            exit 1
          fi

  test:
    needs: validate
    uses: ./.github/workflows/test.yml

  build:
    name: build (${{ matrix.platform }}, ${{ matrix.arch }})
    needs: test
    # Bounds a stuck notarization queue, which would otherwise hold the only
    # self-hosted Mac.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
            artifact: ssh-tunnel-manager
          - os: macos-latest
            platform: darwin
            arch: arm64
            artifact: ssh-tunnel-manager.app
          - os: macos-latest
            platform: darwin
            arch: amd64
            artifact: ssh-tunnel-manager.app
          - os: windows-latest
            platform: windows
            arch: amd64
            artifact: ssh-tunnel-manager.exe

    # The macOS builds of release tags and manual runs go to Artur's Mac in the
    # "Private macOS Builders" group, because GitHub's hosted macOS runners were
    # repeatedly not available. This workflow has no pull_request or branch
    # trigger, and the event check keeps this workflow off the Mac should one be
    # added. It does not stop a fork pull request from bringing its own
    # workflow that targets the group; repository and group settings do that.
    runs-on: ${{ matrix.platform == 'darwin' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.macos_runner != 'github-hosted' && fromJSON('{"group":"Private macOS Builders","labels":"justcode"}') || matrix.os }}

    steps:
      # On the self-hosted Mac every cache and temporary file of the job lives in
      # one directory under RUNNER_TEMP, which the last step deletes. Nothing is
      # installed globally and Homebrew is not used.
      - name: Isolate the job on the self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          STM_TMP="$RUNNER_TEMP/stm"
          if [ -d "$STM_TMP" ]; then chmod -R u+w "$STM_TMP" && rm -rf "$STM_TMP"; fi
          mkdir -p "$STM_TMP/go" "$STM_TMP/go-build" "$STM_TMP/npm" "$STM_TMP/tmp"
          {
            echo "STM_TMP=$STM_TMP"
            echo "GOPATH=$STM_TMP/go"
            echo "GOMODCACHE=$STM_TMP/go/pkg/mod"
            echo "GOCACHE=$STM_TMP/go-build"
            echo "npm_config_cache=$STM_TMP/npm"
            echo "TMPDIR=$STM_TMP/tmp"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Caches are saved after the cleanup steps, so the self-hosted runner,
      # which deletes them, skips caching.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP_VERSION="${{ github.ref_name }}"
          echo "APP_VERSION=${APP_VERSION#v}" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb dbus

      - name: Install NSIS
        if: matrix.platform == 'windows'
        uses: negrutiu/nsis-install@v2

      - name: Build
        shell: bash
        run: scripts/build-app.sh ${{ matrix.arch }} ${{ env.APP_VERSION }}

      # Starts the real app with its webviews and fails the release when the
      # frontend cannot reach the backend. The amd64 macOS build cannot run on an
      # arm64 runner without Rosetta, so it is skipped there.
      - name: Smoke test (macOS)
        if: matrix.platform == 'darwin' && matrix.arch == 'arm64'
        run: |
          # The app allows one instance per user. A copy already running on the
          # runner would take the launch and exit 0, which proves nothing.
          LOCK="$(getconf DARWIN_USER_TEMP_DIR)com.wails.ssh-tunnel-manager.lock"
          if [ -e "$LOCK" ] && lsof -t "$LOCK" >/dev/null 2>&1; then
            echo "SSH Tunnel Manager is running on this runner; quit it and rerun the job." >&2
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/smoke-home"
          mkdir -p "$RUNNER_TEMP/smoke-home"
          STM_SMOKE_TEST=1 HOME="$RUNNER_TEMP/smoke-home" "build/bin/SSH Tunnel Manager.app/Contents/MacOS/ssh-tunnel-manager"

      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        run: |
          # WebKitGTK's sandbox needs user namespaces, which the runner's AppArmor
          # profile blocks by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p "$RUNNER_TEMP/smoke-home"
          STM_SMOKE_TEST=1 HOME="$RUNNER_TEMP/smoke-home" xvfb-run -a dbus-run-session -- build/bin/ssh-tunnel-manager

      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:STM_SMOKE_TEST = "1"
          $env:USERPROFILE = "$env:RUNNER_TEMP\smoke-home"
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $app = Start-Process -FilePath "build\bin\ssh-tunnel-manager.exe" -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "smoke test failed with exit code $($app.ExitCode)" }

      - name: Import Developer ID certificate
        if: matrix.platform == 'darwin'
        env:
          DEVELOPER_ID_APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          umask 077
          echo "$DEVELOPER_ID_APPLICATION_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Put the keychain in front of the user's search list instead of
          # replacing the list: on the self-hosted Mac it is the owner's own.
          # "Remove signing material" takes it out again.
          KEYCHAINS=()
          while IFS= read -r line; do
            path=$(printf '%s\n' "$line" | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
            if [ -n "$path" ] && [ "$path" != "$KEYCHAIN_PATH" ]; then KEYCHAINS+=("$path"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" ${KEYCHAINS[@]+"${KEYCHAINS[@]}"}

          # Sign by certificate hash and only from this keychain, so a Developer
          # ID certificate in the runner owner's login keychain is never used.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ { print $2; exit }')
          test -n "$IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Codesign app bundle
        if: matrix.platform == 'darwin'
        run: |
          PORTLESS_PLIST="build/bin/SSH Tunnel Manager.app/Contents/Library/LaunchDaemons/pl.justcode.ssh-tunnel-manager.portless.plist"
          plutil -lint "$PORTLESS_PLIST"
          /usr/libexec/PlistBuddy -c 'Print :BundleProgram' "$PORTLESS_PLIST" | grep -Fx 'Contents/Library/HelperTools/ssh-tunnel-manager-portless'
          /usr/libexec/PlistBuddy -c 'Print :AssociatedBundleIdentifiers:0' "$PORTLESS_PLIST" | grep -Fx 'com.wails.ssh-tunnel-manager'
          PORTLESS_HELPER="build/bin/SSH Tunnel Manager.app/Contents/Library/HelperTools/ssh-tunnel-manager-portless"
          APP_BINARY="build/bin/SSH Tunnel Manager.app/Contents/MacOS/ssh-tunnel-manager"
          test -x "$PORTLESS_HELPER"
          test "$(lipo -archs "$PORTLESS_HELPER")" = "$(lipo -archs "$APP_BINARY")"
          if otool -L "$PORTLESS_HELPER" | grep -q ServiceManagement; then
            echo "Portless helper must not include the ServiceManagement registration bridge" >&2
            exit 1
          fi

          echo "Signing with identity: $SIGNING_IDENTITY"

          find "build/bin/SSH Tunnel Manager.app" -type f \( -name "*.dylib" -o -name "*.framework" -o -perm +111 \) \
            ! -path "*/Contents/Library/HelperTools/ssh-tunnel-manager-portless" -exec \
            codesign --force --options runtime --timestamp \
              --entitlements build/darwin/entitlements.plist \
              --keychain "$KEYCHAIN_PATH" --sign "$SIGNING_IDENTITY" {} \;

          codesign --force --options runtime --timestamp \
            --entitlements build/darwin/portless-helper.entitlements.plist \
            --keychain "$KEYCHAIN_PATH" --sign "$SIGNING_IDENTITY" \
            "build/bin/SSH Tunnel Manager.app/Contents/Library/HelperTools/ssh-tunnel-manager-portless"

          codesign --force --options runtime --timestamp \
            --entitlements build/darwin/entitlements.plist \
            --keychain "$KEYCHAIN_PATH" --sign "$SIGNING_IDENTITY" \
            "build/bin/SSH Tunnel Manager.app"

          codesign --verify --verbose "build/bin/SSH Tunnel Manager.app"

      # Notarizing only the DMG leaves the app inside without a stapled ticket,
      # so Gatekeeper has to reach Apple on first launch. Notarize and staple
      # the app itself before it goes into the DMG.
      - name: Notarize and staple app bundle
        if: matrix.platform == 'darwin'
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          APP="build/bin/SSH Tunnel Manager.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-notarize.zip" \
            --apple-id artur.czuba.94@gmail.com \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id 4VWT253QFF \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/app-notarize.json"
          STATUS=$(jq -r .status "$RUNNER_TEMP/app-notarize.json")
          echo "App notarization status: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            cat "$RUNNER_TEMP/app-notarize.json"
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      # The window layout (600x400, the app at 150,190, Applications at 450,190,
      # 100 px icons) comes from build/darwin/dmg.DS_Store, which create-dmg
      # wrote for v1.2.0-beta.6. Arranging it live needs AppleScript control of
      # Finder, which the self-hosted Mac does not grant to the runner.
      - name: Create macOS DMG
        if: matrix.platform == 'darwin'
        run: |
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "build/bin/SSH Tunnel Manager.app" "$STAGE/SSH Tunnel Manager.app"
          ln -s /Applications "$STAGE/Applications"
          cp build/darwin/dmg.DS_Store "$STAGE/.DS_Store"
          hdiutil create -volname "SSH Tunnel Manager" -srcfolder "$STAGE" \
            -fs HFS+ -format UDZO -imagekey zlib-level=9 -ov "build/bin/ssh-tunnel-manager.dmg"
          rm -rf "$STAGE"

          codesign --force --timestamp --keychain "$KEYCHAIN_PATH" --sign "$SIGNING_IDENTITY" \
            "build/bin/ssh-tunnel-manager.dmg"
          codesign --verify --verbose "build/bin/ssh-tunnel-manager.dmg"

      - name: Notarize DMG
        if: matrix.platform == 'darwin'
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit "build/bin/ssh-tunnel-manager.dmg" \
            --apple-id artur.czuba.94@gmail.com \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id 4VWT253QFF \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/dmg-notarize.json"
          STATUS=$(jq -r .status "$RUNNER_TEMP/dmg-notarize.json")
          echo "DMG notarization status: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            cat "$RUNNER_TEMP/dmg-notarize.json"
            exit 1
          fi

      - name: Staple notarization ticket
        if: matrix.platform == 'darwin'
        run: xcrun stapler staple "build/bin/ssh-tunnel-manager.dmg"

      - name: Verify notarization
        if: matrix.platform == 'darwin'
        run: |
          xcrun stapler validate "build/bin/ssh-tunnel-manager.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "build/bin/ssh-tunnel-manager.dmg"

          MOUNT_DIR=$(mktemp -d)
          trap 'hdiutil detach -force "$MOUNT_DIR" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_DIR" "build/bin/ssh-tunnel-manager.dmg"
          xcrun stapler validate "$MOUNT_DIR/SSH Tunnel Manager.app"
          spctl --assess --type execute --verbose=2 "$MOUNT_DIR/SSH Tunnel Manager.app"
          hdiutil detach "$MOUNT_DIR"
          trap - EXIT

      - name: Upload Linux artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-manager-linux-amd64
          path: build/bin/ssh-tunnel-manager

      - name: Upload macOS artifact
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-manager-darwin-${{ matrix.arch }}
          path: build/bin/ssh-tunnel-manager.dmg

      - name: Upload Windows portable artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-manager-windows-amd64
          path: build/bin/ssh-tunnel-manager.exe

      - name: Upload Windows installer artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-manager-windows-amd64-installer
          path: build/bin/ssh-tunnel-manager-amd64-installer.exe

      # Runs whatever happened before, so no signing material outlives the job.
      - name: Remove signing material
        if: always() && matrix.platform == 'darwin'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAINS=()
          while IFS= read -r line; do
            path=$(printf '%s\n' "$line" | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
            if [ -n "$path" ] && [ "$path" != "$KEYCHAIN_PATH" ]; then KEYCHAINS+=("$path"); fi
          done < <(security list-keychains -d user)
          # An empty list would drop the login keychain from the search list.
          if [ ${#KEYCHAINS[@]} -gt 0 ]; then security list-keychains -d user -s "${KEYCHAINS[@]}" || true; fi
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -rf "$RUNNER_TEMP/app-notarize.zip" "$RUNNER_TEMP/app-notarize.json" \
            "$RUNNER_TEMP/dmg-notarize.json" "$RUNNER_TEMP/dmg-stage" "$RUNNER_TEMP/smoke-home"
          if security list-keychains -d user | grep -Fq "$KEYCHAIN_PATH"; then
            echo "The signing keychain is still in the search list" >&2
            exit 1
          fi

      - name: Clean the self-hosted workspace
        if: always() && runner.environment == 'self-hosted'
        run: |
          cd "$RUNNER_TEMP"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          if [ -n "${STM_TMP:-}" ] && [ -d "$STM_TMP" ]; then
            chmod -R u+w "$STM_TMP"
            rm -rf "$STM_TMP"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Tests are required twice over: build needs them, and so does this job.
    needs: [test, build]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release metadata from tag message
        id: release_metadata
        shell: bash
        run: |
          # actions/checkout resolves the workflow's tag ref by force-fetching
          # the tagged commit into refs/tags/<tag>, which clobbers the annotated
          # tag object with a lightweight ref. %(contents) on a lightweight tag
          # yields the commit subject, so the release body would otherwise show
          # the last commit message. Re-fetch the annotated tag object first.
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents)' "${{ github.ref_name }}" > tag-message.md
          release_name=$(sed -n '/[^[:space:]]/{p;q;}' tag-message.md)
          if [[ -z "$release_name" ]]; then
            release_name="${{ github.ref_name }}"
          fi
          printf 'name=%s\n' "$release_name" >> "$GITHUB_OUTPUT"

          # The first non-empty line is the release title. Keep the remaining
          # paragraphs as the release body so the title is not duplicated.
          awk 'found { print; next } /[^[:space:]]/ { found=1 }' tag-message.md > release-notes.md
          echo "Release title: $release_name"
          cat release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          tar czf ssh-tunnel-manager-linux-amd64.tar.gz \
            -C ssh-tunnel-manager-linux-amd64 .
          cp ssh-tunnel-manager-darwin-arm64/ssh-tunnel-manager.dmg ./ssh-tunnel-manager-darwin-arm64.dmg
          cp ssh-tunnel-manager-darwin-amd64/ssh-tunnel-manager.dmg ./ssh-tunnel-manager-darwin-amd64.dmg
          zip -r ssh-tunnel-manager-windows-amd64.zip \
            ssh-tunnel-manager-windows-amd64/
          cp ssh-tunnel-manager-windows-amd64-installer/ssh-tunnel-manager-amd64-installer.exe ./

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_metadata.outputs.name }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          make_latest: ${{ contains(github.ref_name, '-beta.') && 'false' || 'true' }}
          files: |
            artifacts/ssh-tunnel-manager-linux-amd64.tar.gz
            artifacts/ssh-tunnel-manager-darwin-arm64.dmg
            artifacts/ssh-tunnel-manager-darwin-amd64.dmg
            artifacts/ssh-tunnel-manager-windows-amd64.zip
            artifacts/ssh-tunnel-manager-amd64-installer.exe
