name: Build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run tests
        run: go test ./internal/... -v -count=1

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
            artifact: ssh-tunnel-manager
          - os: macos-latest
            platform: darwin
            arch: arm64
            wails_platform: darwin/arm64
            artifact: ssh-tunnel-manager.app
          - os: macos-latest
            platform: darwin
            arch: amd64
            wails_platform: darwin/amd64
            artifact: ssh-tunnel-manager.app
          - os: windows-latest
            platform: windows
            arch: amd64
            artifact: ssh-tunnel-manager.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Inject version from tag into wails.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('wails.json', 'utf8'));
            cfg.info.productVersion = '${VERSION}';
            fs.writeFileSync('wails.json', JSON.stringify(cfg, null, 2) + '\n');
          "
          echo "Building version ${VERSION}"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS
        if: matrix.platform == 'windows'
        uses: negrutiu/nsis-install@v2

      - name: Build
        if: matrix.platform != 'windows'
        run: wails build -skipbindings -platform ${{ matrix.wails_platform || matrix.platform }}

      - name: Build with installer
        if: matrix.platform == 'windows'
        run: wails build -skipbindings -nsis

      - name: Import Developer ID certificate
        if: matrix.platform == 'darwin'
        env:
          DEVELOPER_ID_APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$DEVELOPER_ID_APPLICATION_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Codesign app bundle
        if: matrix.platform == 'darwin'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "Signing with identity: $IDENTITY"

          find "build/bin/ssh-tunnel-manager.app" -type f \( -name "*.dylib" -o -name "*.framework" -o -perm +111 \) -exec \
            codesign --force --options runtime --timestamp \
              --entitlements build/darwin/entitlements.plist \
              --sign "$IDENTITY" {} \;

          codesign --force --options runtime --timestamp \
            --entitlements build/darwin/entitlements.plist \
            --sign "$IDENTITY" \
            "build/bin/ssh-tunnel-manager.app"

          codesign --verify --verbose "build/bin/ssh-tunnel-manager.app"

      - name: Create macOS DMG
        if: matrix.platform == 'darwin'
        run: |
          brew install create-dmg
          create-dmg \
            --volname "SSH Tunnel Manager" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "ssh-tunnel-manager.app" 150 190 \
            --hide-extension "ssh-tunnel-manager.app" \
            --app-drop-link 450 190 \
            --codesign "$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | grep 'Developer ID Application' | head -1 | awk -F'\"' '{print $2}')" \
            "build/bin/ssh-tunnel-manager.dmg" \
            "build/bin/"

      - name: Notarize DMG
        if: matrix.platform == 'darwin'
        uses: lando/notarize-action@v2
        with:
          product-path: build/bin/ssh-tunnel-manager.dmg
          appstore-connect-username: artur.czuba.94@gmail.com
          appstore-connect-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          appstore-connect-team-id: 4VWT253QFF
          verbose: true

      - name: Staple notarization ticket
        if: matrix.platform == 'darwin'
        run: xcrun stapler staple "build/bin/ssh-tunnel-manager.dmg"

      - name: Verify notarization
        if: matrix.platform == 'darwin'
        run: |
          xcrun stapler validate "build/bin/ssh-tunnel-manager.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "build/bin/ssh-tunnel-manager.dmg"

      - name: Cleanup keychain
        if: matrix.platform == 'darwin' && always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      - name: Upload Linux artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-manager-linux-amd64
          path: build/bin/ssh-tunnel-manager

      - name: Upload macOS artifact
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-manager-darwin-${{ matrix.arch }}
          path: build/bin/ssh-tunnel-manager.dmg

      - name: Upload Windows portable artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-manager-windows-amd64
          path: build/bin/ssh-tunnel-manager.exe

      - name: Upload Windows installer artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ssh-tunnel-manager-windows-amd64-installer
          path: build/bin/ssh-tunnel-manager-amd64-installer.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from tag message
        run: |
          # actions/checkout resolves the workflow's tag ref by force-fetching
          # the tagged commit into refs/tags/<tag>, which clobbers the annotated
          # tag object with a lightweight ref. %(contents) on a lightweight tag
          # yields the commit subject, so the release body would otherwise show
          # the last commit message. Re-fetch the annotated tag object first.
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents)' "${{ github.ref_name }}" > release-notes.md
          cat release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          tar czf ssh-tunnel-manager-linux-amd64.tar.gz \
            -C ssh-tunnel-manager-linux-amd64 .
          cp ssh-tunnel-manager-darwin-arm64/ssh-tunnel-manager.dmg ./ssh-tunnel-manager-darwin-arm64.dmg
          cp ssh-tunnel-manager-darwin-amd64/ssh-tunnel-manager.dmg ./ssh-tunnel-manager-darwin-amd64.dmg
          zip -r ssh-tunnel-manager-windows-amd64.zip \
            ssh-tunnel-manager-windows-amd64/
          cp ssh-tunnel-manager-windows-amd64-installer/ssh-tunnel-manager-amd64-installer.exe ./

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            artifacts/ssh-tunnel-manager-linux-amd64.tar.gz
            artifacts/ssh-tunnel-manager-darwin-arm64.dmg
            artifacts/ssh-tunnel-manager-darwin-amd64.dmg
            artifacts/ssh-tunnel-manager-windows-amd64.zip
            artifacts/ssh-tunnel-manager-amd64-installer.exe
